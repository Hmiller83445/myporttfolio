<body>

<div class="container mt-5">
    <div class= "text-center mb-5">

    <h1>Neighborhood Housing Calculator</h1>
    <p>Choose a Chicago neighborhood to see average housing prices and taxes.</p>
</div>

<div class="border rounded p-4 mb-4">

    <label> Select a Neighborhood:</label>

    <select id="neighborhood"
    class="form-control mb-4"
    onchange="showHouses()">
<option value="bronzeville">Bronzeville</option>
<option value="pullman">Pullman</option>
<option value="northcenter">North Center</option>
<option value="fullerpark">Fuller Park</option>

</select>

<h2> Neighborhood Information</h2>

<p>
    Average Home Price:
    <span id="homePrice">______</span>
</p>

<p>
    Property Tax Rate:
    <span id="taxRate">_____</span>

</p>

<p>
    Mortgage Rate:
    <span id="mortgageRate">_____</span>
</p>

<label> Enter Down Payment Percent:</label>

<input type="number"
id="downPayment"
class="form-control mb-4">

<h3> Example Houses</h3>
<p id="houseOptions"></p>

<button class="btn btn-primary"
onclick="calculateMortgage()">
Calculate
</button>
<p id = "calculatorResults"></p>
 </div>
</div>
<script>
    function showHouses() {
        let neighborhood =
        document.getElementById("neighborhood").value;
        
        let houses = [];
        if (neighborhood == "bronzeville") {
            houses = [
                "Greystone - $450000",
                "Historic Mansion - $850000",
                "Condo Near the Green Line - $320000"
        ];
        document.getElementById("homePrice").innerHTML="$450000"
        document.getElementById("taxRate").innerHTML="2.1%";
        document.getElementById("mortgageRate").innerHTML="6.5%";
        }
         else if (neighborhood == "pullman") {
            houses = [
                "Historic Row House - $240000",
                "Worker Cottage - $210000",
                "Renovated Townhome - $295000"
         ];

         }
         else if (neighborhood == "northcenter") {
            houses = [
                "Single Family Home - $925000",
                "Brick Two Flat - $780000",
                "Luxury Condo - $540000"
            ];
         }

            else if (neighborhood == "fullerpark") {
                
                houses = [
                    "Frame House - $165000",
                    "Brick Bungalow - $220000",
                    "Vacant Lot Redevelopment - $120000"
                ];
            }

let result = "";
for (let i = 0; i <houses.length; i++) {
    result = result + houses [i] + "<br>";
}

document.getElementById("houseOptions").innerHTML =
result;
}
function calculateMortgage(){
let neighborhood = document.getElementById("neighborhood").value;
let downPaymentPercent = Number(document.getElementById("downPayment").value);
let homePrice = 0;
let mortgageRate = 0;
let taxRate = 0;

if(neighborhood=="bronzeville"){
    homePrice = 450000;
    mortgageRate = 6.5;
    taxRate = 2.1;
}

else if (neighborhood == "pullman"){
    homePrice =  240000;
    mortgageRate = 6.3;
    taxRate = 2.0;
}

else if (neighborhood == "northcenter"){
    homePrice = 925000;
    mortgageRate = 6.7;
    taxRate = 2.2;
}

else if (neighborhood == "fullerpark"){
    homePrice = 165000; 
    mortgageRate = 6.4; 
    taxRate = 2.0;
}

let downPaymentAmount =  homePrice* (downPaymentPercent/100);
let loanAmount = homePrice - downPaymentAmount;
let yearlyPropertyTax = homePrice* (taxRate/100);
document.getElementById("calculatorResults").innerHTML = 
"Average Home Price: $" + homePrice + "<br>"+
"Down Payment: $" + downPaymentAmount.toFixed(2) + "<br>" +
"Estimated Yearly Property Tax:$" + yearlyPropertyTax.toFixed(2);
}
</script>
